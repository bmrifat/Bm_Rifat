<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171410"/>
      <stop offset="50%" stop-color="#211b13"/>
      <stop offset="100%" stop-color="#0c0b08"/>
    </linearGradient>
    <linearGradient id="goldMedal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Laurel Wreath & Medal Graphic -->
  <circle cx="400" cy="200" r="75" fill="none" stroke="url(#goldMedal)" stroke-width="4"/>
  <circle cx="400" cy="200" r="62" fill="rgba(234, 179, 8, 0.1)" stroke="url(#goldMedal)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="400,150 414,185 450,187 422,209 431,245 400,225 369,245 378,209 350,187 386,185" fill="url(#goldMedal)"/>
  
  <!-- Ribbon -->
  <path d="M 370 270 L 350 350 L 390 330 L 400 350 L 410 330 L 450 350 L 430 270 Z" fill="rgba(234, 179, 8, 0.4)" stroke="url(#goldMedal)" stroke-width="2"/>
  
  <!-- Info card -->
  <rect x="50" y="380" width="700" height="80" rx="12" fill="rgba(26, 24, 21, 0.85)" stroke="rgba(234, 179, 8, 0.3)" stroke-width="1"/>
  <text x="80" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#f7f4ed">Nationalian IT Excellence &amp; Innovation Award</text>
  <text x="80" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a39a8c">Recognition for Architectural Leadership &amp; Software Impact</text>
  <rect x="600" y="405" width="120" height="28" rx="14" fill="rgba(234, 179, 8, 0.15)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1"/>
  <text x="660" y="424" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#facc15">ACHIEVEMENT</text>
</svg>