<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1713"/>
      <stop offset="50%" stop-color="#13241b"/>
      <stop offset="100%" stop-color="#080e0a"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Map Pin & Geo Network lines -->
  <line x1="200" y1="240" x2="350" y2="170" stroke="rgba(52, 211, 153, 0.3)" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="350" y1="170" x2="480" y2="230" stroke="rgba(52, 211, 153, 0.3)" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="480" y1="230" x2="600" y2="180" stroke="rgba(52, 211, 153, 0.3)" stroke-width="2" stroke-dasharray="4 4"/>
  
  <circle cx="200" cy="240" r="8" fill="url(#emerald)"/>
  <circle cx="350" cy="170" r="10" fill="url(#emerald)"/>
  <circle cx="480" cy="230" r="12" fill="url(#emerald)"/>
  <circle cx="600" cy="180" r="8" fill="url(#emerald)"/>
  
  <!-- Central Radar beacon -->
  <circle cx="480" cy="230" r="45" fill="none" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.5"/>
  <circle cx="480" cy="230" r="80" fill="none" stroke="rgba(52, 211, 153, 0.2)" stroke-width="1"/>
  
  <!-- Info card -->
  <rect x="50" y="380" width="700" height="80" rx="12" fill="rgba(16, 28, 22, 0.85)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1"/>
  <text x="80" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#f7f4ed">Healthcare Groundwork &amp; Telemedicine Survey</text>
  <text x="80" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a7f3d0">Sub-district Health Centers · Real Patient &amp; Doctor Validation</text>
  <rect x="610" y="405" width="110" height="28" rx="14" fill="rgba(52, 211, 153, 0.15)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1"/>
  <text x="665" y="424" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#34d399">FIELDWORK</text>
</svg>