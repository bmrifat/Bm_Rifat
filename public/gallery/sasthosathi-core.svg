<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141311"/>
      <stop offset="50%" stop-color="#1a1815"/>
      <stop offset="100%" stop-color="#0d0c0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#855b18"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(212, 175, 55, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Subtle circular pulse -->
  <circle cx="400" cy="220" r="140" fill="none" stroke="rgba(212, 175, 55, 0.15)" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="400" cy="220" r="85" fill="none" stroke="rgba(212, 175, 55, 0.3)" stroke-width="1.5"/>
  <circle cx="400" cy="220" r="10" fill="url(#gold)"/>
  
  <!-- Clinical Heartbeat wave -->
  <path d="M 220 220 L 330 220 L 355 160 L 380 280 L 410 180 L 435 240 L 450 220 L 580 220" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Overlay info banner -->
  <rect x="50" y="380" width="700" height="80" rx="12" fill="rgba(26, 24, 21, 0.85)" stroke="rgba(212, 175, 55, 0.25)" stroke-width="1"/>
  <text x="80" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#f7f4ed">SasthoSathi — Clinical AI Architecture</text>
  <text x="80" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a39a8c">Sovereign Healthcare Software · Deterministic Triage Engine</text>
  <rect x="630" y="405" width="90" height="28" rx="14" fill="rgba(212, 175, 55, 0.15)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1"/>
  <text x="675" y="424" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#dfb15b">VENTURE</text>
</svg>