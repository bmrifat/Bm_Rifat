<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141311"/>
      <stop offset="50%" stop-color="#1e1c18"/>
      <stop offset="100%" stop-color="#0a0a08"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfb15b"/>
      <stop offset="100%" stop-color="#966a20"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Auditorium Stage & Speaking Spotlight -->
  <path d="M 100 500 L 400 120 L 700 500 Z" fill="rgba(223, 177, 91, 0.05)"/>
  <ellipse cx="400" cy="400" rx="220" ry="40" fill="rgba(223, 177, 91, 0.1)"/>
  
  <!-- Podium / Microphone graphic -->
  <line x1="400" y1="200" x2="400" y2="340" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="400" cy="180" r="22" fill="#1e1c18" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="400" cy="180" r="10" fill="url(#gold)"/>
  <line x1="360" y1="340" x2="440" y2="340" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Soundwave rays -->
  <path d="M 340 180 A 65 65 0 0 1 340 140" fill="none" stroke="rgba(223, 177, 91, 0.4)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 460 180 A 65 65 0 0 0 460 140" fill="none" stroke="rgba(223, 177, 91, 0.4)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 320 190 A 90 90 0 0 1 320 130" fill="none" stroke="rgba(223, 177, 91, 0.25)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 480 190 A 90 90 0 0 0 480 130" fill="none" stroke="rgba(223, 177, 91, 0.25)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Info card -->
  <rect x="50" y="380" width="700" height="80" rx="12" fill="rgba(26, 24, 21, 0.85)" stroke="rgba(212, 175, 55, 0.25)" stroke-width="1"/>
  <text x="80" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#f7f4ed">DIU CSE Speakers Club — Keynote Leadership</text>
  <text x="80" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a39a8c">Ex-Organising Secretary · Technological Sovereignty & Systems Talk</text>
  <rect x="620" y="405" width="100" height="28" rx="14" fill="rgba(212, 175, 55, 0.15)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1"/>
  <text x="670" y="424" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#dfb15b">SPEAKING</text>
</svg>